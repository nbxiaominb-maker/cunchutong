server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 300s
  max_upload_size: 5368709120  # 5GB

storage:
  data_dir: "./data"
  tmp_dir: "./data/files/tmp"
  thumbnail_dir: "./data/thumbnails"

database:
  path: "./data/metadata.db"

security:
  api_keys:
    - name: "admin"
      key: "bucketd_admin_key_change_me"
      permissions: ["read", "write", "delete", "admin"]
  allowed_types: []   # empty = allow all
  blocked_types: []

thumbnails:
  enabled: true
  default_size: 200
  max_size: 800

cors:
  allowed_origins: ["*"]
  max_age: 86400

logging:
  level: "info"
  format: "json"
